# Runs the same checks you run locally (`npm run verify` in personal-website/)
# on every pull request and on pushes to main. It only reads the repo: no
# secrets, no deploy, no commits.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: personal-website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: personal-website/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Data files
        run: npm run check:data

      - name: Build
        run: npm run build

      - name: Photo and cover budgets
        run: npm run check:assets

      - name: Export dry run (every reference resolves, nothing is changed)
        run: npm run export:check
